[project]
name = "pwgdeploy"
version = "0.1.0"
description = "Deploy this Piwigo fork to an FTPS web space and complete its first-run install"
requires-python = ">=3.11"
dependencies = []                      # stdlib only, on purpose

[project.scripts]
pwg-deploy = "pwgdeploy.cli:main"

[dependency-groups]
dev = ["pytest>=8", "pytest-randomly>=3"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["pwgdeploy"]

[tool.pytest.ini_options]
addopts = "-q --strict-markers --strict-config -W error"
testpaths = ["tests"]
