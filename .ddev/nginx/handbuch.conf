# The handbook is served to logged-in users only, through handbuch.php (decision 0063).
# ^~ keeps the regex locations (\.php$, dotfiles) from serving anything under /handbuch/.
# The trailing ? drops the request's own query string, as the .htaccess does: only the path picks
# the file. absolute_redirect off keeps the 301 relative, so it keeps the scheme and port.
location = /handbuch {
    absolute_redirect off;
    return 301 /handbuch/;
}

location ^~ /handbuch/ {
    rewrite ^/handbuch/(.*)$ /handbuch.php?f=$1? last;
}
